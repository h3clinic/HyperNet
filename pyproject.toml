[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hypernet-starter"
version = "0.8.0"
description = "One-image category and instance recognition experiments with explicit data budgets"
requires-python = ">=3.11"
dependencies = ["numpy>=2.0", "Pillow>=10", "opencv-python-headless>=4.10", "scipy>=1.12"]

[project.optional-dependencies]
neural = ["torch>=2.5", "torchvision>=0.20"]
matching = ["kornia>=0.8"]
data = ["requests>=2.31"]
dev = ["pytest>=8", "scikit-learn>=1.5"]

[project.scripts]
hypernet = "hypernet.cli:main"

[tool.setuptools.packages.find]
include = ["hypernet*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
